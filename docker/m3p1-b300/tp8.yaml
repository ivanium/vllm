tensor-parallel-size: 8
max-num-seqs: 8
block-size: 128
kv-cache-dtype: nvfp4
attention-config:
  indexer_kv_dtype: nvfp4
  use_prefill_query_quantization: true
disable-hybrid-kv-cache-manager: true
enable-prefix-caching: true
language-model-only: true
trust-remote-code: true
gpu-memory-utilization: 0.9
max-model-len: 1048576
stream-interval: 20
prefill-schedule-interval: 24
max-num-batched-tokens: 32768
compilation-config:
  cudagraph_mode: FULL_AND_PIECEWISE
  cudagraph_capture_sizes: [8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112, 120, 128, 136, 144, 152, 160, 168, 176, 184, 192, 200, 208, 216, 224, 232, 240, 248, 256, 320, 384, 448, 512, 576, 640, 704, 768, 832, 896, 960, 1024, 1536, 2048, 3072, 4096, 6144, 8192]
speculative-config:
  method: dspark
  num_speculative_tokens: 7
  attention_backend: FLASH_ATTN
  kv_cache_dtype: fp8
  draft_sample_method: probabilistic
  rejection_sample_method: block
additional-config:
  decode_backend: latency_specialized
